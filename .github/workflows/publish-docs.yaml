name: Publish Docs
on:
  push:
    branches:
      - main
      - web-editor # TEMP: testing this workflow from a branch, revert before merge
    # paths:
      # - 'docs/**'
      # - mkdocs.yml
      # - 'web/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Load vendored versions
        run: cat web/vendor.env >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v5
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material
      - run: mkdocs build --site-dir site

      # An allow-list: only what the browser loads is deployed. Tests, types,
      # configs and scripts under web/ stay out, including any added later.
      # The LICENSE files ship with the code they cover.
      - name: Copy the app into the site
        run: |
          mkdir -p site/web
          rsync -a \
            --include='/index.html' \
            --include='/LICENSE' \
            --include='/app/***' \
            --include='/shared/' \
            --include='/shared/*.js' \
            --include='/shared/texmf/' \
            --include='/shared/texmf/carried-texmf.bin' \
            --include='/shared/vendor/' \
            --include='/shared/vendor/texlyre-busytex.js' \
            --include='/shared/vendor/texlyre-busytex.LICENSE' \
            --exclude='*' \
            web/ site/web/

      - name: Inline the stats script
        run: |
          page=site/web/app/index.html
          curl -fsSL https://scripts.simpleanalyticscdn.com/latest.js -o "$RUNNER_TEMP/sa.js"
          grep -q '<!-- stats placeholder -->' "$page"
          awk -v js="$RUNNER_TEMP/sa.js" '
            /<!-- stats placeholder -->/ {
              print "<script>"
              while ((getline line < js) > 0) print line
              print "</script>"
              next
            }
            { print }
          ' "$page" > "$page.tmp" && mv "$page.tmp" "$page"

      - name: Copy scenario sources into web/repo/
        run: |
          mkdir -p site/web/repo
          for dir in clash coops campaigns draft-scenarios templates assets sections; do
            rsync -a --safe-links "$dir/" "site/web/repo/$dir/"
          done
          cp metadata.tex site/web/repo/metadata.tex

      # Generated, not committed: how often the book uses each glyph, so the
      # editor's \svg{} suggestions offer common glyphs first.
      - name: Count glyph uses for the editor
        run: node web/glyph-usage.mjs site/web/repo/assets/glyphs-inkscape/glyph-usage.json

      - name: Restore the BusyTeX engine payload
        id: engine-cache
        uses: actions/cache@v5
        with:
          key: busytex-engine-${{ env.BUSYTEX_ENGINE_VERSION }}
          path: site/web/core/busytex

      - name: Fetch the BusyTeX engine payload
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p site/web/core/busytex
          url="https://github.com/TeXlyre/texlyre-busytex/releases/download/assets-v${BUSYTEX_ENGINE_VERSION}/busytex-assets.tar.gz"
          curl -fsSL "$url" | tar xz -C site/web/core/busytex --strip-components=1

      # The app preloads one data package (DATA_PACKAGE in
      # web/shared/build-plan.js) and the book never runs biber, so the other
      # packages would only eat into the 1 GB site limit.
      - name: Keep only the engine files the app loads
        working-directory: site/web/core/busytex
        run: |
          package=$(sed -n 's/^export const DATA_PACKAGE = "\(.*\)";$/\1/p' "$GITHUB_WORKSPACE/web/shared/build-plan.js")
          [[ -n "$package" && -f "$package.data" ]] || { echo "No data package named by DATA_PACKAGE: '$package'" >&2; exit 1; }
          find . -maxdepth 1 -type f ! \( \
            -name busytex.js -o -name busytex.wasm -o -name busytex_pipeline.js \
            -o -name busytex_worker.js -o -name busytex_biber.js \
            -o -name "$package.js" -o -name "$package.data" \) -delete
          du -sh .

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
