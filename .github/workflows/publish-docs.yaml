name: Publish Docs
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Load vendored versions
        run: cat web/vendor.env >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v5
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material
      - run: mkdocs build --site-dir site

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the app
        working-directory: web
        run: npm ci && npm run build

      # The app is served at /builder/: web/dist/, the build of web/app/,
      # becomes site/builder/. It finds core/, repo/, the engine wrapper, the
      # carried texmf bundle and the LICENSE files one level up, so those land
      # at the site root, next to the MkDocs output. The rest of web/shared/
      # is code the build already bundled, so it stays out.
      # An allow-list: only what the browser loads is deployed. Tests, types,
      # configs and scripts under web/ stay out, including any added later.
      # web/index.html stays out too: at the site root it would replace the
      # MkDocs home page. The LICENSE files ship with the code they cover.
      - name: Copy the app into the site
        run: |
          rsync -a web/dist/ site/builder/
          rsync -a \
            --include='/LICENSE' \
            --include='/LATEX-ENGINE-NOTICE' \
            --include='/shared/' \
            --include='/shared/texmf/' \
            --include='/shared/texmf/carried-texmf.bin' \
            --include='/shared/vendor/' \
            --include='/shared/vendor/texlyre-busytex.js' \
            --include='/shared/vendor/texlyre-busytex.LICENSE' \
            --exclude='*' \
            web/ site/

      # The app used to live at /web/app/. Old bookmarks, shared deep links
      # (#/drafts/...) and OAuth returns (?code=) keep their query and hash.
      - name: Redirect the old app address
        run: |
          mkdir -p site/web/app
          cat > site/web/app/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Redirecting to the scenario builder</title>
          <script>
            location.replace(new URL("../../builder/", location.href).pathname + location.search + location.hash);
          </script>
          </head>
          <body>
          <p>The scenario builder has moved to <a href="../../builder/">a new address</a>.</p>
          </body>
          </html>
          EOF
          cat > site/web/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=../builder/">
          <title>Redirecting to the scenario builder</title>
          </head>
          <body>
          <p>The scenario builder has moved to <a href="../builder/">a new address</a>.</p>
          </body>
          </html>
          EOF

      - name: Inline the stats script
        run: |
          page=site/builder/index.html
          curl -fsSL https://scripts.simpleanalyticscdn.com/latest.js -o "$RUNNER_TEMP/sa.js"
          grep -q '<!-- stats placeholder -->' "$page"
          awk -v js="$RUNNER_TEMP/sa.js" '
            /<!-- stats placeholder -->/ {
              print "<script>"
              while ((getline line < js) > 0) print line
              print "</script>"
              next
            }
            { print }
          ' "$page" > "$page.tmp" && mv "$page.tmp" "$page"

      - name: Copy scenario sources into repo/
        run: |
          mkdir -p site/repo
          for dir in clash coops campaigns draft-scenarios templates assets sections; do
            rsync -a --safe-links "$dir/" "site/repo/$dir/"
          done
          cp metadata.tex site/repo/metadata.tex

      # Generated, not committed: how often the book uses each glyph, so the
      # editor's \svg{} suggestions offer common glyphs first.
      - name: Count glyph uses for the editor
        run: node web/glyph-usage.ts site/repo/assets/glyphs-inkscape/glyph-usage.json

      - name: Restore the BusyTeX engine payload
        id: engine-cache
        uses: actions/cache@v5
        with:
          key: busytex-engine-${{ env.BUSYTEX_ENGINE_VERSION }}
          path: site/core/busytex

      - name: Fetch the BusyTeX engine payload
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p site/core/busytex
          url="https://github.com/TeXlyre/texlyre-busytex/releases/download/assets-v${BUSYTEX_ENGINE_VERSION}/busytex-assets.tar.gz"
          curl -fsSL "$url" | tar xz -C site/core/busytex --strip-components=1

      # The app preloads one data package (DATA_PACKAGE in
      # web/shared/build-plan.ts) and the book never runs biber, so the other
      # packages would only eat into the 1 GB site limit.
      - name: Keep only the engine files the app loads
        working-directory: site/core/busytex
        run: |
          package=$(sed -n 's/^export const DATA_PACKAGE = "\(.*\)";$/\1/p' "$GITHUB_WORKSPACE/web/shared/build-plan.ts")
          [[ -n "$package" && -f "$package.data" ]] || { echo "No data package named by DATA_PACKAGE: '$package'" >&2; exit 1; }
          find . -maxdepth 1 -type f ! \( \
            -name busytex.js -o -name busytex.wasm -o -name busytex_pipeline.js \
            -o -name busytex_worker.js -o -name busytex_biber.js \
            -o -name "$package.js" -o -name "$package.data" \) -delete
          du -sh .

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
