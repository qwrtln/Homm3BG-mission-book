name: Publish Docs
on:
  push:
    branches:
      - main
      - web-editor # TEMP: testing this workflow from a branch, revert before merge
    # paths:
      # - 'docs/**'
      # - mkdocs.yml
      # - 'web/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BUSYTEX_ENGINE_VERSION: 1.4.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v5
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material
      - run: mkdocs build --site-dir site

      - name: Copy the app into the site
        run: |
          mkdir -p site/web
          rsync -a --exclude 'prototype-engine-check' web/ site/web/

      - name: Inline the stats script
        run: |
          page=site/web/app/index.html
          curl -fsSL https://scripts.simpleanalyticscdn.com/latest.js -o "$RUNNER_TEMP/sa.js"
          grep -q '<!-- stats placeholder -->' "$page"
          awk -v js="$RUNNER_TEMP/sa.js" '
            /<!-- stats placeholder -->/ {
              print "<script>"
              while ((getline line < js) > 0) print line
              print "</script>"
              next
            }
            { print }
          ' "$page" > "$page.tmp" && mv "$page.tmp" "$page"

      - name: Copy scenario sources into web/repo/
        # web/app/index.html fetches scenarios, templates, and shared
        # assets by a path relative to itself, resolved against web/repo/
        # (ticket 17). This step is that directory's only source: nothing
        # here is served from the site root, so it cannot collide with
        # mkdocs' own site/assets/.
        # --safe-links: draft-scenarios/ holds symlinks out to repository-root
        # files this copy does not otherwise include (.version, latexmkrc,
        # both local-build-only, read by neither the app nor its build
        # logic). Without this flag those become dangling symlinks in the
        # copy, and actions/upload-pages-artifact fails outright trying to
        # archive one, silently, with no clearer error than exit code 1.
        run: |
          mkdir -p site/web/repo
          for dir in clash coops campaigns draft-scenarios templates assets sections; do
            rsync -a --safe-links "$dir/" "site/web/repo/$dir/"
          done
          cp metadata.tex site/web/repo/metadata.tex

      - name: Restore the BusyTeX engine payload
        id: engine-cache
        uses: actions/cache@v5
        with:
          key: busytex-engine-${{ env.BUSYTEX_ENGINE_VERSION }}
          path: site/web/core/busytex

      - name: Fetch the BusyTeX engine payload
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p site/web/core/busytex
          url="https://github.com/TeXlyre/texlyre-busytex/releases/download/assets-v${BUSYTEX_ENGINE_VERSION}/busytex-assets.tar.gz"
          curl -fsSL "$url" | tar xz -C site/web/core/busytex --strip-components=1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
