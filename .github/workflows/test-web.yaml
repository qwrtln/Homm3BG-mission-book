name: Test web scenario builder

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/test-web.yaml'

jobs:
  unit:
    runs-on: ubuntu-latest
    name: Unit tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache npx packages
        if: always()
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: npx-typescript-5.9.2

      - name: Show Node version
        run: node --version

      - name: Run unit tests
        run: node --test web/tests/unit/

      - name: Type-check
        if: always()
        run: npx -y -p typescript@5.9.2 tsc --noEmit --project web/jsconfig.json
