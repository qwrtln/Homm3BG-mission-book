name: Test web scenario builder

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/test-web.yaml'
  push:
    branches:
      - web-editor # TEMP: testing this workflow from a branch, revert before merge

jobs:
  unit:
    runs-on: ubuntu-latest
    name: Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm/_npx
            ~/.cache/ms-playwright
          key: web-tests-${{ hashFiles('web/tests/package-lock.json', 'web/vendor.env', 'web/biome.json') }}
          restore-keys: |
            web-tests-

      - name: Type-check
        if: always()
        run: npx -y -p typescript@5.9.2 tsc --noEmit --project web/jsconfig.json

      - name: Lint and format check
        if: always()
        working-directory: web
        run: npx -y @biomejs/biome@2.5.14 check .

      - name: Show Node version
        run: node --version

      - name: Run unit tests
        run: node --test "web/tests/unit/**/*.test.mjs"

      - name: Install Playwright
        run: npm ci --prefix web/tests

      - name: Install Playwright browser
        working-directory: web/tests
        run: npx playwright install --with-deps chromium

      - name: Run integration tests
        working-directory: web/tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/tests/playwright-report/
          retention-days: 3
